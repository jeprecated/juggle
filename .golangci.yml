version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
